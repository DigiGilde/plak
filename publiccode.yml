description:
  nl:
    localisedName: Plak
    shortDescription: >-
      Statische sites publiceren en delen met previews per pull request,
      met vijf toegangsniveaus.
    longDescription: >-
      Plak is een platform waarmee overheidsorganisaties statische
      sites eenvoudig publiceren en delen: publiek, achter SSO Rijk, met
      genodigden op e-mailadres, of via een geheime link. Elke pull
      request kan een eigen preview krijgen. Plak is gebouwd in de
      huisstandaard-stack (FastAPI, Vue, PostgreSQL), met een
      herbruikbare publicatie-action voor CI.
    features:
      - Publiceren van statische sites op een eigen groep/site-pad
      - PR-previews met automatische opruiming
      - "Vijf toegangsniveaus: publiek, geheime link, SSO Rijk, groepsleden, genodigden"
      - Tweetalige (Nederlands en Engels) beheer-SPA voor groepen, sites, toegang en leden
      - Publiceren vanuit de eigen computer met de plak-CLI
      - Herbruikbare GitHub/Forgejo-action voor publicatie in CI, aangemeld met een OIDC-token
