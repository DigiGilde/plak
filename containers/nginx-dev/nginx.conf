worker_processes auto;

# nginx-unprivileged runs non-root; the compiled default /run/nginx.pid
# is then not writable.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

# Dumb reverse proxy, only for the dev compose (course correction 2026-09-12
# decision 1): everything goes to the app with the original Host, which does
# content, SPA and host separation itself. There is no nginx on ZAD.
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    server_tokens off;

    client_max_body_size 550m;

    log_format plak '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer"';
    access_log /dev/stdout plak;
    error_log  /dev/stderr warn;

    # Resolver not hardcoded: /docker-entrypoint.d/10-resolver.sh generates
    # this file at startup from the first nameserver in /etc/resolv.conf
    # (the aardvark DNS on compose's network gateway).
    include /etc/nginx/resolver.conf;
    resolver_timeout 5s;

    # Admin host: any hostname starting with "beheer.".
    server {
        listen 8080;
        server_name ~^beheer\.;

        # Variable instead of an upstream block: this way nginx resolves the
        # app name only per request, and "nginx -t" does not fail if the
        # app container is not running yet.
        set $plak_app app:8080;

        # nginx's own liveness, separate from the app (e2e/run.sh waits on this).
        location = /healthz-proxy {
            default_type "text/plain; charset=utf-8";
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://$plak_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Dev-only: makes the mock OIDC reachable on a *.localhost hostname
    # that both the browser (via 127.0.0.1:8080) and the app container (via
    # the network alias on nginx in dev/compose.yml) can resolve. Pass Host
    # including port ($http_host), because mock-oauth2-server derives the
    # issuer from the Host header and the app checks that issuer exactly.
    server {
        listen 8080;
        server_name oidc.plak.localhost;

        set $plak_oidc mock-oidc:8080;

        location / {
            proxy_pass http://$plak_oidc;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }
    }

    # Content host and default: anything not starting with "beheer.", and
    # any request without a matching Host header.
    server {
        listen 8080 default_server;
        server_name _;

        set $plak_app app:8080;

        location = /healthz-proxy {
            default_type "text/plain; charset=utf-8";
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://$plak_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
