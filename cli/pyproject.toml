# The publishing CLI, a project of its own: it depends on httpx and on
# nothing from the backend package, so `uv tool install` gives a `plak`
# command without pulling in the server.
[project]
name = "plak"
version = "0.1.0"
description = "Plak CLI - publish static sites and clean up previews"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
plak = "plak_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plak_cli"]

# Branch coverage at 100, as in the backend. No greenlet here: the CLI is
# synchronous.
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
