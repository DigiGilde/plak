# The publishing CLI, a project of its own: it depends on httpx and on
# nothing from the backend package, so `uv tool install` gives a `plak`
# command without pulling in the server.
[project]
name = "plak"
version = "0.1.0"
description = "Plak CLI - statische sites publiceren en previews opruimen"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
plak = "plak_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plak_cli"]
