# The live rulesets against .github/rulesets/ (docs/releasing.md): a file
# that was never applied is a red check instead of a silent gap. It runs on
# every pull request and in the merge queue, where its job is the required
# check `rulesets`, and daily, which catches a ruleset edited in the UI while
# no pull request is open.
#
# A workflow of its own rather than a job in ci.yml: a called workflow cannot
# carry a `schedule` (see codeql.yml), and one definition serves all three.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Rulesets

on:
  pull_request:
  merge_group:
  schedule:
    # 05:43 UTC, off the hour like the CodeQL run.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rulesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the live rulesets with the files
        run: python3 .github/scripts/rulesets.py check
        env:
          GH_TOKEN: ${{ github.token }}
