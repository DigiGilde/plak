# Preparatory: the repo has no remote yet, so this workflow has never run.
# It describes the gates that `just lint`, `just test` and the frontend
# build already enforce locally, so they run along once the repo is on a
# GitHub remote.
#
# This workflow has no trigger of its own: deploy.yml calls it, so a
# deploy cannot bypass the gate and the checks run once per commit
# instead of twice.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check src tests

      # From the repo root, so ruff uses its defaults for cli/ instead of
      # backend/pyproject.toml; --project only picks the pinned ruff.
      - name: Lint CLI (ruff)
        run: uv run --project backend ruff check cli/plak_cli cli/tests

      # The DB tests run PostgreSQL 16 via testcontainers. The
      # GitHub-hosted ubuntu runner has Docker on board, but the conftest
      # by default looks for a Podman socket and SKIPS the tests when it
      # does not find one. Setting DOCKER_HOST is thus not a luxury: it is
      # the difference between running and silently skipping. On a runner
      # without a container runtime the step below fails with a clear
      # message instead of going green on skipped tests.
      - name: Containerruntime controleren
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "Geen containerruntime op deze runner: testcontainers kan geen PostgreSQL starten." >&2
            echo "Draai deze job op een runner met Docker of Podman, of zet DOCKER_HOST." >&2
            exit 1
          fi

      # Coverage runs inside this job rather than in one of its own: the
      # suite takes minutes and running it twice for a number is a cost
      # with nothing behind it. The floor lives in backend/pyproject.toml
      # (fail_under), so pytest fails the job when coverage drops.
      - name: Backend-tests met dekking (testcontainers)
        working-directory: backend
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        # -rs shows the reason for every skipped test, so a silently
        # skipped container test stays visible in the log.
        run: uv run python -m pytest -q -rs --cov=src/plak --cov-report=term-missing:skip-covered

  # cli/ is its own uv project (the `plak` command), separate from the
  # backend. Its lint runs in the backend job, on the ruff pinned there.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: CLI-tests met dekking
        working-directory: cli
        run: uv run pytest tests -q --cov=plak_cli --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Afhankelijkheden installeren
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Must be before the tests: the CSP gate reads frontend/dist/index.html.
      - name: Build
        working-directory: frontend
        run: npm run build

      # With coverage, on the same run: the thresholds in vite.config.ts
      # fail this step when coverage drops, and a second pass purely for a
      # number would cost the suite twice.
      - name: Frontend-tests met dekking
        working-directory: frontend
        run: npm run coverage

      # Deliberately runs once more, separate from the suite above, so the
      # CI log names this gate explicitly: the built index.html may not
      # carry an inline <script> without src, otherwise the admin CSP
      # (script-src 'self', no unsafe-inline) no longer matches what is
      # served.
      - name: CSP-check op de gebouwde SPA
        working-directory: frontend
        run: npx vitest run tests/build-output.test.ts

  # The whole product against a real stack: nginx, the app, PostgreSQL and
  # the mock OIDC, driven through a browser. The unit suites cannot see
  # what breaks here, because cookies, two origins, a shadow DOM and a real
  # database only exist once it all runs together.
  #
  # It runs on every pull request, dependency bumps included: a bump to a
  # frontend dependency is exactly the kind of change that passes the unit
  # suites and breaks the running application. The job is on its own
  # runner, so it costs wall clock only where it is the slowest job.
  #
  # The stack comes up through e2e/run.sh, the same script `just e2e`
  # calls; PLAK_E2E_ENGINE points it at docker, because the runner has no
  # podman.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # run.sh generates dev/.secrets/ with a Python one-liner, and the CLI
      # scenario runs the real CLI through `uv run --project cli`.
      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock

      # Same reasoning as in the backend job: fail loudly rather than run
      # a suite that quietly has nothing to talk to.
      - name: Containerruntime controleren
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "Geen containerruntime op deze runner: de e2e-stack kan niet starten." >&2
            exit 1
          fi

      # dev/compose.yml mounts frontend/dist read-only into the app; without
      # it /admin answers 503 and half the scenarios fail on that.
      - name: SPA bouwen
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Playwright installeren
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E-suite draaien
        env:
          PLAK_E2E_ENGINE: docker
        run: ./e2e/run.sh

      # A trace and a screenshot per failed scenario; without them an e2e
      # failure in CI is a stack trace and nothing to look at.
      - name: Playwright-artefacten bewaren
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Runs .pre-commit-config.yaml over the whole tree, so a commit made
  # without the local hook installed is still caught. The gitleaks hook in
  # that config scans the staged diff and is therefore a no-op here; the
  # job `secret-scan` below is what covers secrets in CI.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # Building the gitleaks hook from source takes longer than the rest
      # of the job together; the cache key follows the pinned revisions.
      - name: Hookomgevingen uit de cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit-hooks draaien
        run: uvx pre-commit@4.5.1 run --all-files --show-diff-on-failure

  # `git commit --no-verify` walks past the local gitleaks hook, so the
  # same scan runs here as well. Two scans, because the modes see
  # different things:
  #
  #   - `gitleaks dir` reads the working tree as checked out, so it sees
  #     the state that gets merged;
  #   - `gitleaks git --log-opts` reads the commits the pull request adds,
  #     so it also sees a secret that was added in one commit and taken
  #     out again in the next. That one stays in the history after a
  #     merge, and a working-tree scan is blind to it.
  #
  # gitleaks-action is not used on purpose: it asks an organization
  # account for a paid licence key, which is exactly the dependency this
  # repository is getting rid of. `go install` at an exact tag is verified
  # against the Go checksum database; the module path is still the old
  # zricethezav one, which is what the go.mod of gitleaks declares.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit range needs both of its ends in the checkout, and
          # the default single-commit fetch has neither. A pull request has
          # no bound on its length, so full history it is; this repository
          # is a few hundred commits, a second of fetching.
          fetch-depth: 0

      # go install lands the binary in GOPATH/bin, which is not on PATH in
      # the next step. Adding it there beats calling gitleaks by full path
      # in every scan below.
      - name: Gitleaks installeren
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Werkboom scannen op geheimen
        run: gitleaks dir . --redact --no-banner

      - name: Commits van deze pull request scannen
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --redact --no-banner --log-opts="$BASE..$HEAD"

  # Trivy on a pull request, so a base image with a known hole is caught
  # before anything is deployed with it. deploy.yml scans the built image
  # and that stays: this job is the earlier, cheaper half, not a copy.
  #
  # What it scans and why:
  #
  #   - the Containerfiles as configuration. Nothing else in the pipeline
  #     looks at them, and it costs seconds.
  #   - the base images that actually ship. containers/plak/Containerfile
  #     is multi-stage: the node and uv stages build the SPA and the venv
  #     and then stay behind, so only the python runtime base ends up in
  #     the image. The nginx base is the dev stack's and does not deploy,
  #     but it is cheap and it is ours to keep current, so it is reported
  #     rather than gated.
  #
  # Not scanned here: the built image, because building it means npm ci,
  # a vite build and a uv sync on every pull request, minutes of work that
  # `bouw` in deploy.yml already does. What a full image scan would add on
  # top of the base image is the Python and npm dependency tree, and the
  # `vulnerabilities` job below reads those from the lockfiles already.
  #
  # The gate is the same line the deploy draws (CRITICAL and HIGH, only
  # what has a fix), so a pull request cannot pass a gate that the deploy
  # would then fail on. Suppressions come from the same .trivyignore.yaml.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Read the digests out of the Containerfiles rather than repeating
      # them here: Dependabot bumps the Containerfiles, and a second copy
      # would quietly keep scanning yesterday's image.
      - name: Basisimages uit de Containerfiles lezen
        id: bases
        run: |
          set -euo pipefail
          runtime="$(grep -oE '^FROM docker\.io/library/python@sha256:[0-9a-f]{64}' \
            containers/plak/Containerfile | tail -1 | cut -d' ' -f2)"
          nginx="$(grep -oE '^FROM docker\.io/nginxinc/nginx-unprivileged@sha256:[0-9a-f]{64}' \
            containers/nginx-dev/Containerfile | tail -1 | cut -d' ' -f2)"
          if [ -z "$runtime" ] || [ -z "$nginx" ]; then
            echo "Basisimage niet gevonden: staat de FROM-regel er nog zoals verwacht?" >&2
            exit 1
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx" >> "$GITHUB_OUTPUT"

      - name: Containerfiles scannen (trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: containers
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.74.0

      - name: Runtime-basisimage scannen (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.bases.outputs.runtime }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0

      # Report, no gate: this image runs only in dev/compose.yml and never
      # reaches a deploy, and the pin it carries is far enough behind that
      # gating on it would paint every pull request red over something a
      # publisher is never exposed to. The findings stay in the log, and
      # Dependabot offers the digest bump that clears them.
      - name: Nginx-basisimage scannen, alleen rapport (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.bases.outputs.nginx }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          version: v0.74.0

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # uv export instead of the venv: pip-audit then reads exactly what
      # the lockfile pins, including the dev group, and nothing from the
      # runner.
      - name: Backend-afhankelijkheden scannen (pip-audit)
        env:
          REQUIREMENTS: ${{ runner.temp }}/requirements.txt
        run: |
          uv export --directory backend --frozen --no-emit-project --quiet \
            --format requirements-txt -o "$REQUIREMENTS"
          flags=()
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              flags+=(--ignore-vuln "$id")
            fi
          done < <(uv run --script .github/scripts/vulnerabilities.py ids)
          uvx pip-audit@2.10.1 --requirement "$REQUIREMENTS" --disable-pip \
            --progress-spinner off ${flags[@]+"${flags[@]}"}

      # cli/ is the one component users install on their own machines
      # (README.md); it has its own uv project and lockfile, separate from
      # the backend, so it needs its own export-and-audit step.
      - name: CLI-afhankelijkheden scannen (pip-audit)
        env:
          REQUIREMENTS: ${{ runner.temp }}/cli-requirements.txt
        run: |
          uv export --directory cli --frozen --no-emit-project --quiet \
            --format requirements-txt -o "$REQUIREMENTS"
          flags=()
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              flags+=(--ignore-vuln "$id")
            fi
          done < <(uv run --script .github/scripts/vulnerabilities.py ids)
          uvx pip-audit@2.10.1 --requirement "$REQUIREMENTS" --disable-pip \
            --progress-spinner off ${flags[@]+"${flags[@]}"}

      # npm audit reads the lockfile and does not need node_modules; the
      # script does the filtering, because npm audit has no ignore list.
      - name: Frontend-afhankelijkheden scannen (npm audit)
        env:
          REPORT: ${{ runner.temp }}/npm-audit.json
        run: |
          npm audit --json --prefix frontend > "$REPORT" || true
          uv run --script .github/scripts/vulnerabilities.py npm-audit "$REPORT"
