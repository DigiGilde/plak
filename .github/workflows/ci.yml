# Preparatory: the repo has no remote yet, so this workflow has never run.
# It describes the gates that `just lint`, `just test` and the frontend
# build already enforce locally, so they run along once the repo is on a
# GitHub remote.
#
# This workflow has no trigger of its own: deploy.yml calls it, so a
# deploy cannot bypass the gate and the checks run once per commit
# instead of twice.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check src tests

      # From the repo root, so ruff uses its defaults for cli/ instead of
      # backend/pyproject.toml; --project only picks the pinned ruff.
      - name: Lint CLI (ruff)
        run: uv run --project backend ruff check cli/plak_cli cli/tests

      # The DB tests run PostgreSQL 16 via testcontainers. The
      # GitHub-hosted ubuntu runner has Docker on board, but the conftest
      # by default looks for a Podman socket and SKIPS the tests when it
      # does not find one. Setting DOCKER_HOST is thus not a luxury: it is
      # the difference between running and silently skipping. On a runner
      # without a container runtime the step below fails with a clear
      # message instead of going green on skipped tests.
      - name: Containerruntime controleren
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "Geen containerruntime op deze runner: testcontainers kan geen PostgreSQL starten." >&2
            echo "Draai deze job op een runner met Docker of Podman, of zet DOCKER_HOST." >&2
            exit 1
          fi

      - name: Backend-tests (testcontainers)
        working-directory: backend
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        # -rs shows the reason for every skipped test, so a silently
        # skipped container test stays visible in the log.
        run: uv run python -m pytest -q -rs

  # cli/ is its own uv project (the `plak` command), separate from the
  # backend. Its lint runs in the backend job, on the ruff pinned there.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: CLI-tests
        working-directory: cli
        run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Afhankelijkheden installeren
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Must be before the tests: the CSP gate reads frontend/dist/index.html.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Frontend-tests
        working-directory: frontend
        run: npm test

      # Deliberately runs once more, separate from the suite above, so the
      # CI log names this gate explicitly: the built index.html may not
      # carry an inline <script> without src, otherwise the admin CSP
      # (script-src 'self', no unsafe-inline) no longer matches what is
      # served.
      - name: CSP-check op de gebouwde SPA
        working-directory: frontend
        run: npx vitest run tests/build-output.test.ts

  # Runs .pre-commit-config.yaml over the whole tree, so a commit made
  # without the local hook installed is still caught. The gitleaks hook in
  # that config scans the staged diff and is therefore a no-op here; the
  # job `secret-scan` below is what covers secrets in CI.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # Building the gitleaks hook from source takes longer than the rest
      # of the job together; the cache key follows the pinned revisions.
      - name: Hookomgevingen uit de cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit-hooks draaien
        run: uvx pre-commit@4.5.1 run --all-files --show-diff-on-failure

  # `git commit --no-verify` walks past the local gitleaks hook, so the
  # same scan runs here as well. Two scans, because the modes see
  # different things:
  #
  #   - `gitleaks dir` reads the working tree as checked out, so it sees
  #     the state that gets merged;
  #   - `gitleaks git --log-opts` reads the commits the pull request adds,
  #     so it also sees a secret that was added in one commit and taken
  #     out again in the next. That one stays in the history after a
  #     merge, and a working-tree scan is blind to it.
  #
  # gitleaks-action is not used on purpose: it asks an organization
  # account for a paid licence key, which is exactly the dependency this
  # repository is getting rid of. `go install` at an exact tag is verified
  # against the Go checksum database; the module path is still the old
  # zricethezav one, which is what the go.mod of gitleaks declares.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit range needs both of its ends in the checkout, and
          # the default single-commit fetch has neither. A pull request has
          # no bound on its length, so full history it is; this repository
          # is a few hundred commits, a second of fetching.
          fetch-depth: 0

      - name: Gitleaks installeren
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Werkboom scannen op geheimen
        run: gitleaks dir . --redact --no-banner

      - name: Commits van deze pull request scannen
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --redact --no-banner --log-opts="$BASE..$HEAD"

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: uv installeren
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # uv export instead of the venv: pip-audit then reads exactly what
      # the lockfile pins, including the dev group, and nothing from the
      # runner.
      - name: Backend-afhankelijkheden scannen (pip-audit)
        env:
          REQUIREMENTS: ${{ runner.temp }}/requirements.txt
        run: |
          uv export --directory backend --frozen --no-emit-project --quiet \
            --format requirements-txt -o "$REQUIREMENTS"
          flags=()
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              flags+=(--ignore-vuln "$id")
            fi
          done < <(uv run --script .github/scripts/vulnerabilities.py ids)
          uvx pip-audit@2.10.1 --requirement "$REQUIREMENTS" --disable-pip \
            --progress-spinner off ${flags[@]+"${flags[@]}"}

      # cli/ is the one component users install on their own machines
      # (README.md); it has its own uv project and lockfile, separate from
      # the backend, so it needs its own export-and-audit step.
      - name: CLI-afhankelijkheden scannen (pip-audit)
        env:
          REQUIREMENTS: ${{ runner.temp }}/cli-requirements.txt
        run: |
          uv export --directory cli --frozen --no-emit-project --quiet \
            --format requirements-txt -o "$REQUIREMENTS"
          flags=()
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              flags+=(--ignore-vuln "$id")
            fi
          done < <(uv run --script .github/scripts/vulnerabilities.py ids)
          uvx pip-audit@2.10.1 --requirement "$REQUIREMENTS" --disable-pip \
            --progress-spinner off ${flags[@]+"${flags[@]}"}

      # npm audit reads the lockfile and does not need node_modules; the
      # script does the filtering, because npm audit has no ignore list.
      - name: Frontend-afhankelijkheden scannen (npm audit)
        env:
          REPORT: ${{ runner.temp }}/npm-audit.json
        run: |
          npm audit --json --prefix frontend > "$REPORT" || true
          uv run --script .github/scripts/vulnerabilities.py npm-audit "$REPORT"
