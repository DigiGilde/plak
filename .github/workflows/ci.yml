# The gates that `just lint`, `just test` and the frontend build already
# enforce locally, run again on the server. Written before the repo had a
# remote, which is why it follows the local commands rather than the other
# way round.
#
# This workflow has no trigger of its own: deploy.yml calls it, so a
# deploy cannot bypass the gate and the checks run once per commit
# instead of twice.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependabot updates `uses:` references, not this input: bump it by hand,
  # together with the same variable in deploy.yml.
  TRIVY_VERSION: v0.74.0

jobs:
  # The backend suite in parts side by side (backend/tests/parts.py).
  # `backend-tests` below judges their results, `backend-coverage` merges
  # their coverage.
  backend-part:
    name: backend-tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [access, auth, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The DB tests run PostgreSQL 16 via testcontainers. The
      # GitHub-hosted ubuntu runner has Docker on board, but the conftest
      # by default looks for a Podman socket and SKIPS the tests when it
      # does not find one. Setting DOCKER_HOST is thus not a luxury: it is
      # the difference between running and silently skipping. On a runner
      # without a container runtime the step below fails with a clear
      # message instead of going green on skipped tests.
      - name: Check the container runtime
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "No container runtime on this runner: testcontainers cannot start PostgreSQL." >&2
            echo "Run this job on a runner with Docker or Podman, or set DOCKER_HOST." >&2
            exit 1
          fi

      # The floor is not checked per part, only on the merged data in
      # `backend-coverage`.
      - name: Backend tests with coverage (testcontainers)
        working-directory: backend
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          PLAK_TEST_PART: ${{ matrix.part }}
          COVERAGE_FILE: .coverage.${{ matrix.part }}
        # -rs shows the reason for every skipped test, so a silently
        # skipped container test stays visible in the log. -n auto runs one
        # worker per CPU; each worker starts its own PostgreSQL container
        # (the container fixtures are session-scoped, and a session is a
        # worker), so no two workers ever share a database.
        run: uv run python -m pytest -q -rs -n auto --cov=src/plak --cov-report= --cov-fail-under=0

      # Also when the tests failed: coverage is judged on its own, in
      # `backend-coverage`, and a part without data fails it there.
      - name: Keep the coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage-${{ matrix.part }}
          path: backend/.coverage.${{ matrix.part }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The required check for the backend tests. `!cancelled()` because a
  # failed part would skip a plain dependent, and a skipped required check
  # counts as passed.
  backend-tests:
    needs: backend-part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every test part to pass
        if: needs.backend-part.result != 'success'
        env:
          RESULT: ${{ needs.backend-part.result }}
        run: |
          echo "Not every backend test part passed (${RESULT})." >&2
          exit 1

  # The required check for the backend coverage, whatever the tests
  # concluded. `!cancelled()` for the same reason as in `backend-tests`.
  backend-coverage:
    needs: backend-part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Fetch the coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-coverage-*
          merge-multiple: true
          path: backend

      # `coverage combine` merges whatever .coverage.* files it finds, so a
      # missing part would only lower the number, or not even that.
      - name: Require the data of every test part
        working-directory: backend
        run: |
          missing=0
          for part in $(cd tests && uv run python -c 'import parts; print(*parts.PARTS)'); do
            if [ ! -f ".coverage.${part}" ]; then
              echo "No coverage data from backend test part ${part}." >&2
              missing=1
            fi
          done
          exit "${missing}"

      # The floor lives in backend/pyproject.toml (fail_under), so the
      # report fails this job when the merged coverage drops.
      - name: Coverage over all parts
        working-directory: backend
        run: |
          uv run coverage combine
          uv run coverage report --skip-covered --show-missing

  # .github/scripts/release.py and rulesets.py lie outside src/plak, so the
  # backend coverage does not measure them. Their tests run here, measured
  # on those two files only, against the same floor.
  release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Release script tests with coverage
        working-directory: backend
        run: |
          uv run coverage run --include='*/.github/scripts/release.py,*/.github/scripts/rulesets.py' -m pytest -q tests/test_release.py tests/test_rulesets.py
          uv run coverage report --include='*/.github/scripts/release.py,*/.github/scripts/rulesets.py' --show-missing --fail-under=100

  # cli/ is its own uv project (the `plak` command), separate from the
  # backend. Its lint runs in `pre-commit`, like the backend's.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: CLI tests with coverage
        working-directory: cli
        run: uv run pytest tests -q --cov=plak_cli --cov-report=term-missing:skip-covered

  # The same suite on Windows, without the coverage floor: the `cli` job
  # already covers the Windows branches by switching cli.WINDOWS, this job
  # shows they really run there.
  cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: CLI tests
        working-directory: cli
        run: uv run pytest tests -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Check types
        working-directory: frontend
        run: npm run typecheck

      # Must be before the tests: the CSP gate reads frontend/dist/index.html.
      - name: Build
        working-directory: frontend
        run: npm run build

      # With coverage, on the same run: the thresholds in vite.config.ts
      # fail this step when coverage drops, and a second pass purely for a
      # number would cost the suite twice.
      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run coverage

      # Deliberately runs once more, separate from the suite above, so the
      # CI log names this gate explicitly: the built index.html may not
      # carry an inline <script> without src, otherwise the admin CSP
      # (script-src 'self', no unsafe-inline) no longer matches what is
      # served.
      - name: CSP check on the built SPA
        working-directory: frontend
        run: npx vitest run tests/build-output.test.ts

  # The whole product against a real stack: nginx, the app, PostgreSQL and
  # the mock OIDC, driven through a browser. The unit suites cannot see
  # what breaks here, because cookies, two origins, a shadow DOM and a real
  # database only exist once it all runs together.
  #
  # It runs on every pull request, dependency bumps included: a bump to a
  # frontend dependency is exactly the kind of change that passes the unit
  # suites and breaks the running application. The job is on its own
  # runner, so it costs wall clock only where it is the slowest job.
  #
  # The stack comes up through e2e/run.sh, the same script `just e2e`
  # calls; PLAK_E2E_ENGINE points it at docker, because the runner has no
  # podman.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # run.sh generates dev/.secrets/ with a Python one-liner, and the CLI
      # scenario runs the real CLI through `uv run --project cli`.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock

      # Same reasoning as in `backend-tests`: fail loudly rather than run
      # a suite that quietly has nothing to talk to.
      - name: Check the container runtime
        run: |
          if [ ! -S /var/run/docker.sock ]; then
            echo "No container runtime on this runner: the e2e stack cannot start." >&2
            exit 1
          fi

      # dev/compose.yml mounts frontend/dist read-only into the app; without
      # it /admin answers 503 and half the scenarios fail on that.
      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the e2e suite
        env:
          PLAK_E2E_ENGINE: docker
        run: ./e2e/run.sh

      # A trace and a screenshot per failed scenario; without them an e2e
      # failure in CI is a stack trace and nothing to look at.
      - name: Keep the Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Runs .pre-commit-config.yaml over the whole tree, so a commit made
  # without the local hook installed is still caught. The gitleaks hook in
  # that config scans the staged diff and is therefore a no-op here; the
  # job `secret-scan` below is what covers secrets in CI.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Building the gitleaks hook from source takes longer than the rest
      # of the job together; the cache key follows the pinned revisions.
      - name: Hook environments from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the pre-commit hooks
        run: uv run --project backend --only-group tools pre-commit run --all-files --show-diff-on-failure

  # `git commit --no-verify` walks past the local gitleaks hook, so the
  # same scan runs here as well. Two scans, because the modes see
  # different things:
  #
  #   - `gitleaks dir` reads the working tree as checked out, so it sees
  #     the state that gets merged;
  #   - `gitleaks git --log-opts` reads the commits the pull request adds,
  #     so it also sees a secret that was added in one commit and taken
  #     out again in the next. That one stays in the history after a
  #     merge, and a working-tree scan is blind to it.
  #
  # gitleaks-action is not used on purpose: it asks an organization
  # account for a paid licence key, which is exactly the dependency this
  # repository is getting rid of. `go install` at an exact tag is verified
  # against the Go checksum database; the module path is still the old
  # zricethezav one, which is what the go.mod of gitleaks declares.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit range needs both of its ends in the checkout, and
          # the default single-commit fetch has neither. A pull request has
          # no bound on its length, so full history it is; this repository
          # is a few hundred commits, a second of fetching.
          fetch-depth: 0

      # go install lands the binary in GOPATH/bin, which is not on PATH in
      # the next step. Adding it there beats calling gitleaks by full path
      # in every scan below.
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan the working tree for secrets
        run: gitleaks dir . --redact --no-banner

      - name: Scan the commits of this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --redact --no-banner --log-opts="$BASE..$HEAD"

  # Trivy on a pull request, so a base image with a known hole is caught
  # before anything is deployed with it. deploy.yml scans the built image
  # and that stays: this job is the earlier, cheaper half, not a copy.
  #
  # What it scans and why:
  #
  #   - the Containerfiles as configuration. Nothing else in the pipeline
  #     looks at them, and it costs seconds.
  #   - the base images that actually ship. containers/plak/Containerfile
  #     is multi-stage: the node and uv stages build the SPA and the venv
  #     and then stay behind, so only the python runtime base ends up in
  #     the image. The nginx base is the dev stack's and does not deploy,
  #     but it is cheap and it is ours to keep current, so it is reported
  #     rather than gated.
  #
  # Not scanned here: the built image, because building it means npm ci,
  # a vite build and a uv sync on every pull request, minutes of work that
  # `build` in deploy.yml already does. What a full image scan would add on
  # top of the base image is the Python and npm dependency tree, and the
  # `vulnerabilities` job below reads those from the lockfiles already.
  #
  # The gate is the same line the deploy draws (CRITICAL and HIGH, only
  # what has a fix), so a pull request cannot pass a gate that the deploy
  # would then fail on. Suppressions come from the same .trivyignore.yaml.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read the digests out of the Containerfiles rather than repeating
      # them here: Dependabot bumps the Containerfiles, and a second copy
      # would quietly keep scanning yesterday's image.
      - name: Read the base images from the Containerfiles
        id: bases
        run: |
          set -euo pipefail
          # The tag in front of the digest is for Dependabot; trivy gets
          # repo@digest only.
          runtime="$(grep -oE '^FROM docker\.io/library/python(:[^@ ]+)?@sha256:[0-9a-f]{64}' \
            containers/plak/Containerfile | tail -1 | cut -d' ' -f2 | sed -E 's/:[^@/]+@/@/')"
          nginx="$(grep -oE '^FROM docker\.io/nginxinc/nginx-unprivileged(:[^@ ]+)?@sha256:[0-9a-f]{64}' \
            containers/nginx-dev/Containerfile | tail -1 | cut -d' ' -f2 | sed -E 's/:[^@/]+@/@/')"
          if [ -z "$runtime" ] || [ -z "$nginx" ]; then
            echo "Base image not found: is the FROM line still as expected?" >&2
            exit 1
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx" >> "$GITHUB_OUTPUT"

      - name: Scan the Containerfiles (trivy config)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: containers
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan the runtime base image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.bases.outputs.runtime }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

      # Gated like the image that ships. This one only runs in
      # dev/compose.yml, but it runs on every developer's machine, and the
      # bump from an end-of-life tag to 1.30-alpine took it from 38 findings
      # to 1. What is left is carried in .trivyignore.yaml with a date on
      # which it comes back, so the gate stays honest instead of standing
      # open.
      - name: Scan the nginx base image (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.bases.outputs.nginx }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # uv export instead of the venv: pip-audit then reads exactly what
      # the lockfile pins, including the dev group, and nothing from the
      # runner.
      - name: Scan the backend dependencies (pip-audit)
        env:
          REQUIREMENTS: ${{ runner.temp }}/requirements.txt
        run: |
          uv export --directory backend --frozen --no-emit-project --quiet \
            --format requirements-txt -o "$REQUIREMENTS"
          flags=()
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              flags+=(--ignore-vuln "$id")
            fi
          done < <(uv run --script .github/scripts/vulnerabilities.py ids)
          uv run --project backend --only-group tools pip-audit --requirement "$REQUIREMENTS" --disable-pip \
            --progress-spinner off ${flags[@]+"${flags[@]}"}

      # cli/ is the one component users install on their own machines
      # (README.md); it has its own uv project and lockfile, separate from
      # the backend, so it needs its own export-and-audit step.
      - name: Scan the CLI dependencies (pip-audit)
        env:
          REQUIREMENTS: ${{ runner.temp }}/cli-requirements.txt
        run: |
          uv export --directory cli --frozen --no-emit-project --quiet \
            --format requirements-txt -o "$REQUIREMENTS"
          flags=()
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              flags+=(--ignore-vuln "$id")
            fi
          done < <(uv run --script .github/scripts/vulnerabilities.py ids)
          uv run --project backend --only-group tools pip-audit --requirement "$REQUIREMENTS" --disable-pip \
            --progress-spinner off ${flags[@]+"${flags[@]}"}

      # npm audit reads the lockfile and does not need node_modules; the
      # script does the filtering, because npm audit has no ignore list.
      - name: Scan the frontend dependencies (npm audit)
        env:
          REPORT: ${{ runner.temp }}/npm-audit.json
        run: |
          npm audit --json --prefix frontend > "$REPORT" || true
          uv run --script .github/scripts/vulnerabilities.py npm-audit "$REPORT"
