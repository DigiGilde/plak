# How Plak ends up on ZAD: build and push the image, then deploy with
# zad-actions. A push to `beta` runs both halves, so every push reaches
# production; the preview half is still written for a situation that has
# to be created, not one that has been observed.
#
# Needed in advance, outside this file:
#   - repository secret ZAD_API_KEY (the project's API key, returned once
#     when the project is created and stored in .env.zadctl);
#   - repository variable ZAD_PROJECT_ID (ZAD's project key, with the
#     suffix the platform assigns);
#   - a ZAD project following deploy/plak-project.example.yaml, with the
#     deployment `productie` and the component `beheer`.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Test and deploy

on:
  push:
    branches: [main, beta]
  pull_request:
    # labeled/unlabeled as well: a preview follows the `preview` label, so
    # putting it on has to start one and taking it off has to clean it up.
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  # Without it the merge queue on beta gets no checks and merges nothing.
  merge_group:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Dependabot updates `uses:` references, not this input: bump it by hand,
  # together with the same variable in ci.yml.
  TRIVY_VERSION: v0.74.0

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # A label event only matters when it is the `preview` label: every other
  # label would otherwise run the whole suite for a word on a pull request.
  ci:
    if: >-
      github.event.action != 'closed'
      && (github.event.action != 'unlabeled')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    uses: ./.github/workflows/ci.yml

  # A dependabot PR does not need a preview environment; the gate above
  # still runs over it.
  #
  # Builds alongside `ci` rather than after it. What keeps untested code out
  # of a preview (which inherits production secrets) and out of production
  # is `needs: [ci, build]` on those two jobs, not this one.
  build:
    if: >-
      github.event.action != 'closed' && github.event_name != 'merge_group'
      && (github.event.action != 'unlabeled')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # This job executes the Containerfile, so `npm ci` and `uv sync` run
    # here. It therefore holds no more than building and pushing needs; the
    # attestation permissions sit in `provenance` below.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      name: ${{ steps.tag.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine the image tag
        id: tag
        run: |
          name="${REGISTRY}/${IMAGE_NAME}"
          name="$(echo "${name}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=${name}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${name}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needed for the cache step below: the default driver cannot export
      # cache, this action boots one with the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build context is the repo root: the image bundles the built admin
      # SPA from frontend/ alongside the backend (see
      # containers/plak/Containerfile).
      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/plak/Containerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate the SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: cyclonedx
          output: sbom.cdx.json
          version: ${{ env.TRIVY_VERSION }}

      # Also the transport to `provenance`, which attests it.
      - name: Keep the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Everything in the log first, only then the gate. The difference
      # between "not found" and "seen, deliberately not blocked" is
      # exactly what an auditor asks first.
      - name: Scan the image, full report (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "0"
          version: ${{ env.TRIVY_VERSION }}

      # A red scan fails `build` and thereby also `preview` and `production`;
      # the tag stays in the registry, but nothing deploys with it.
      - name: Scan the image, gate on high and critical (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  # A job holding `id-token: write` can mint an OIDC token for any audience
  # it names, and that token carries this repository's identity. So it does
  # not belong in `build`, which runs the whole dependency tree of this
  # project through the Containerfile. actions/attest needs neither the
  # image nor a checkout: a subject name plus the digest that was pushed is
  # enough, and the SBOM travels as an artefact. That makes a job of its own
  # that runs no project code possible, and this is it.
  #
  # The digest comes straight from `build` as a job output, never re-resolved
  # from the tag: the two jobs cannot disagree about what was pushed.
  #
  # `needs: build` and nothing else: a skipped or failed `build` skips this
  # too, so there is no path on which an image gets attested that was not
  # built, scanned and pushed. It sits beside `preview` and `production`
  # rather than in front of them; a deploy does not wait on it.
  #
  # Attestations on a private repository need GitHub Enterprise Cloud; on
  # the Free plan they work only while the repository is public, which it
  # is since 2026-09-27. Available, not yet exercised: every run so far
  # skipped this job with `build`, so no attestation exists to verify.
  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/attest reads ~/.docker/config.json for the registry push, so
      # the login below is what makes `push-to-registry` work.
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.sha }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.name }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.name }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  # preview and cleanup wait for the ZAD project: without ZAD_PROJECT_ID
  # there is nothing to deploy to, and every pull request would go red.
  #
  # And on the `preview` label, because a preview is not free: it is a pod, a
  # database and a Let's Encrypt certificate per pull request, it clones
  # production's configuration, and most changes are answered by the checks
  # above without anyone opening it. Asking for one is one click; getting one
  # unasked is the cost of every pull request.
  preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed'
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && vars.ZAD_PROJECT_ID != ''
    runs-on: ubuntu-latest
    needs: [ci, build]
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: ${{ steps.rollout.outputs.url }}
    env:
      # The same base URL the deploy action defaults to, named once so the
      # step below and the action cannot drift apart. The action gets it
      # explicitly for that reason.
      ZAD_API_BASE_URL: https://operations-manager.rig.prd1.gn2.quattro.rijksapps.nl/api
    steps:
      # A preview inherits the component-wide user-env-vars, and those are
      # productie's PLAK_SESSION_SECRET, PLAK_AUDIT_PEPPER and
      # PLAK_AUDIT_IP_KEY. So the deployment is created here first with
      # rollout=false, which writes it to the project file and puts nothing
      # on the cluster, and then gets its own three secrets at the
      # deployment-component layer, which wins over the component-wide
      # value. Only the step after this one rolls out, so a preview pod
      # never runs with productie's secrets, not even briefly.
      #
      # The order is forced: the values endpoint answers 404 until the
      # component is attached to the deployment, so the deployment has to
      # exist in the project file before the secrets can be written to it.
      #
      # Verified against the Operations Manager OpenAPI (vendored in
      # RijksICTGilde/zad-cli as api/upstream-openapi.json) and the handlers
      # in RijksICTGilde/RIG-Cluster: upsert_deployment and
      # configure_service_values both honour rollout=false, both take the
      # project API key in X-API-Key, and both are asynchronous, hence the
      # polling.
      #
      # The secrets are generated once per preview and never rotated on a
      # later push: a rewrite would be a change saved with rollout=false
      # that the rollout below has no reason to pick up.
      - name: Give the preview its own secrets
        env:
          ZAD_API_KEY: ${{ secrets.ZAD_API_KEY }}
          PROJECT_ID: ${{ vars.ZAD_PROJECT_ID }}
          DEPLOYMENT: pr-${{ github.event.pull_request.number }}
          COMPONENT: beheer
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          values="${ZAD_API_BASE_URL}/v2/projects/${PROJECT_ID}/services/user-env-vars/values/deployment/${DEPLOYMENT}/component/${COMPONENT}"

          # Sets CALL_CODE and CALL_BODY. A body is piped in, never passed as
          # an argument, so no secret ends up in the process list.
          call() {
            local method="$1" url="$2" body="${3-}" out
            if [ -n "$body" ]; then
              out=$(printf '%s' "$body" | curl -sS -w '\n%{http_code}' --max-time 60 \
                -X "$method" -H "X-API-Key: ${ZAD_API_KEY}" \
                -H 'Content-Type: application/json' --data-binary @- "$url")
            else
              out=$(curl -sS -w '\n%{http_code}' --max-time 60 \
                -X "$method" -H "X-API-Key: ${ZAD_API_KEY}" "$url")
            fi
            CALL_CODE=$(printf '%s' "$out" | tail -n1)
            CALL_BODY=$(printf '%s' "$out" | sed '$d')
          }

          require_success() {
            case "${CALL_CODE}" in
              2*) return 0 ;;
            esac
            echo "::error::$1 returned HTTP ${CALL_CODE}"
            echo "${CALL_BODY}"
            return 1
          }

          # Both writes are asynchronous: the task has to finish before the
          # next step may assume its result.
          wait_for_task() {
            local id status
            id=$(printf '%s' "${CALL_BODY}" | jq -r '.task_id // empty')
            if [ -z "${id}" ]; then
              echo "::error::$1 returned no task_id"
              return 1
            fi
            for _ in $(seq 1 120); do
              call GET "${ZAD_API_BASE_URL}/tasks/${id}"
              require_success "Fetching task ${id}"
              status=$(printf '%s' "${CALL_BODY}" | jq -r '.status // empty')
              case "${status}" in
                completed) return 0 ;;
                failed|cancelled)
                  echo "::error::$1 is ${status}"
                  printf '%s' "${CALL_BODY}" | jq -r '.error_message // empty'
                  return 1 ;;
              esac
              sleep 5
            done
            echo "::error::$1 had not finished after ten minutes"
            return 1
          }

          echo "Creating deployment ${DEPLOYMENT} without a rollout"
          create_body=$(jq -n --arg d "${DEPLOYMENT}" --arg c "${COMPONENT}" --arg i "${IMAGE}" \
            '{deploymentName: $d, cloneFrom: "productie", components: [{reference: $c, image: $i}]}')
          call POST "${ZAD_API_BASE_URL}/v2/projects/${PROJECT_ID}/:upsert-deployment?rollout=false" "${create_body}"
          require_success "Creating the deployment"
          wait_for_task "Creating the deployment"

          call GET "${values}"
          require_success "Reading the preview secrets"
          complete=true
          for name in PLAK_SESSION_SECRET PLAK_AUDIT_PEPPER PLAK_AUDIT_IP_KEY; do
            printf '%s' "${CALL_BODY}" | jq -e --arg n "${name}" '.values | has($n)' >/dev/null || complete=false
          done
          if [ "${complete}" = true ]; then
            echo "This preview already has its own secrets; left unchanged"
            exit 0
          fi

          echo "Creating own secrets for ${DEPLOYMENT}"
          # base64 of 32 random bytes each: long enough for the two 32-byte
          # minimums, and the exact shape PLAK_AUDIT_IP_KEY wants. The
          # alphabet carries no whitespace or quotes, so the value reads back
          # byte for byte, which the API requires.
          SESSION_SECRET=$(openssl rand -base64 32 | tr -d '\n')
          AUDIT_PEPPER=$(openssl rand -base64 32 | tr -d '\n')
          AUDIT_IP_KEY=$(openssl rand -base64 32 | tr -d '\n')
          echo "::add-mask::${SESSION_SECRET}"
          echo "::add-mask::${AUDIT_PEPPER}"
          echo "::add-mask::${AUDIT_IP_KEY}"
          export SESSION_SECRET AUDIT_PEPPER AUDIT_IP_KEY

          # A partly filled layer is cleared first: POST refuses a name that
          # is already there, and this layer belongs to this preview alone.
          call DELETE "${values}?rollout=false"
          require_success "Clearing the preview secrets"
          wait_for_task "Clearing the preview secrets"

          secrets_body=$(jq -n '{values: {
            PLAK_SESSION_SECRET: env.SESSION_SECRET,
            PLAK_AUDIT_PEPPER: env.AUDIT_PEPPER,
            PLAK_AUDIT_IP_KEY: env.AUDIT_IP_KEY
          }}')
          call POST "${values}?rollout=false" "${secrets_body}"
          require_success "Setting the preview secrets"
          wait_for_task "Setting the preview secrets"

      # clone-from copies the `productie` deployment, but DROPS THE WEB
      # ADDRESS: a preview lands on the cluster address with a single host,
      # not on beheer.plak.<domain> plus plak.<domain>. `components` is
      # also on the clone's exclusion list, so production's env vars do
      # not come along: a preview needs its own
      # PLAK_BASE_URL/PLAK_CONTENT_BASE_URL. This action (v2) cannot set
      # that; see docs/deploying-on-zad.md, "Wat nog openstaat".
      #
      # The step above already created the deployment (rollout=false), so
      # this call updates it and is the one that rolls out. It processes
      # only this deployment, never productie.
      - name: Roll out to ZAD
        id: rollout
        uses: RijksICTGilde/zad-actions/deploy@4ac541a57542a22bde95b28f3ace4ee3123acd7a # v4.2.0
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          api-base-url: ${{ env.ZAD_API_BASE_URL }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: pr-${{ github.event.pull_request.number }}
          component: beheer
          image: ${{ needs.build.outputs.image }}
          clone-from: productie
          comment-on-pr: true

  # Two moments: the pull request closes, or the label comes off while it is
  # still open. The second is what makes the label a switch rather than a
  # one-way start; without it a preview taken off the label would run on
  # until the pull request closed.
  cleanup:
    if: >-
      github.event_name == 'pull_request'
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'unlabeled'
          && !contains(github.event.pull_request.labels.*.name, 'preview')
        )
      )
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && vars.ZAD_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
      pull-requests: write
    steps:
      - name: Clean up the preview
        uses: RijksICTGilde/zad-actions/cleanup@4ac541a57542a22bde95b28f3ace4ee3123acd7a # v4.2.0
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: pr-${{ github.event.pull_request.number }}
          delete-github-deployments: true
          delete-container: true
          container-org: ${{ github.repository_owner }}
          container-name: ${{ github.event.repository.name }}
          container-tag: pr-${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The automatic GITHUB_TOKEN may not delete an environment; that
          # needs a PAT with repo admin rights as github-admin-token. Turn
          # on both lines once that exists.
          delete-github-env: false

  production:
    # `beta` is this repository's default branch; there is no `main`, so that
    # ref never matched and every push built an image the rollout then never
    # collected. The ZAD_PROJECT_ID guard is the same one `preview` carries:
    # without a project there is nothing to deploy to, and the action would
    # fail on an empty api-key instead of standing down.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/beta'
      && vars.ZAD_PROJECT_ID != ''
    runs-on: ubuntu-latest
    needs: [ci, build]
    permissions:
      contents: read
    environment:
      name: productie
      url: ${{ steps.rollout.outputs.url }}
    steps:
      - name: Roll out to ZAD
        id: rollout
        uses: RijksICTGilde/zad-actions/deploy@4ac541a57542a22bde95b28f3ace4ee3123acd7a # v4.2.0
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: productie
          component: beheer
          image: ${{ needs.build.outputs.image }}
