# How Plak ends up on ZAD: build and push the image, then deploy with
# zad-actions. A push to `beta` builds, scans and attests the image and
# deploys nowhere; production follows a release tag (vYYYY.M.D[.N]) alone.
# The preview half is still written for a situation that has to be
# created, not one that has been observed.
#
# Needed in advance, outside this file:
#   - repository secret ZAD_API_KEY (the project's API key, returned once
#     when the project is created and stored in .env.zadctl);
#   - repository variable ZAD_PROJECT_ID (ZAD's project key, with the
#     suffix the platform assigns);
#   - a ZAD project following deploy/plak-project.example.yaml, with the
#     deployment `productie` and the component `beheer`.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Test and deploy

on:
  push:
    branches: [main, beta]
    # A release tag. GitHub's filter cannot say vYYYY.M.D[.N] exactly, so
    # RELEASE_TAG below is what decides.
    tags: ['v[0-9][0-9][0-9][0-9].*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Without it the merge queue on beta gets no checks and merges nothing.
  merge_group:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Dependabot updates `uses:` references, not this input: bump it by hand,
  # together with the same variable in ci.yml.
  TRIVY_VERSION: v0.74.0
  RELEASE_TAG: '^v[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(\.[1-9][0-9]*)?$'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml

  # A dependabot PR does not need a preview environment; the gate above
  # still runs over it.
  #
  # Builds alongside `ci` rather than after it. What keeps untested code out
  # of a preview (which inherits production secrets) and out of production
  # is `needs: [ci, build]` on those two jobs, not this one.
  build:
    if: >-
      github.event.action != 'closed' && github.event_name != 'merge_group'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # This job executes the Containerfile, so `npm ci` and `uv sync` run
    # here. It therefore holds no more than building and pushing needs; the
    # attestation permissions sit in `provenance` below.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      name: ${{ steps.tag.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine the image tag
        id: tag
        run: |
          name="${REGISTRY}/${IMAGE_NAME}"
          name="$(echo "${name}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=${name}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${name}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # The tag name goes through env and is checked before it is used: git
      # allows characters in a tag that the tag list below reads as a
      # separator.
      - name: Determine the release version
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.tag.outputs.name }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if [[ ! "${TAG}" =~ ${RELEASE_TAG} ]]; then
            echo "::error::${TAG} is not a release tag of the form vYYYY.M.D[.N]"
            exit 1
          fi
          version="${TAG#v}"
          echo "build-args=PLAK_VERSION=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}"
            echo "${NAME}:${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needed for the cache step below: the default driver cannot export
      # cache, this action boots one with the docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build context is the repo root: the image bundles the built admin
      # SPA from frontend/ alongside the backend (see
      # containers/plak/Containerfile).
      - name: Build and push the image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/plak/Containerfile
          push: true
          tags: ${{ steps.release.outputs.tags || steps.tag.outputs.image }}
          build-args: ${{ steps.release.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate the SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: cyclonedx
          output: sbom.cdx.json
          version: ${{ env.TRIVY_VERSION }}

      # Also the transport to `provenance`, which attests it.
      - name: Keep the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Everything in the log first, only then the gate. The difference
      # between "not found" and "seen, deliberately not blocked" is
      # exactly what an auditor asks first.
      - name: Scan the image, full report (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "0"
          version: ${{ env.TRIVY_VERSION }}

      # A red scan fails `build` and thereby also `preview` and `production`;
      # the tag stays in the registry, but nothing deploys with it.
      - name: Scan the image, gate on high and critical (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  # A job holding `id-token: write` can mint an OIDC token for any audience
  # it names, and that token carries this repository's identity. So it does
  # not belong in `build`, which runs the whole dependency tree of this
  # project through the Containerfile. actions/attest needs neither the
  # image nor a checkout: a subject name plus the digest that was pushed is
  # enough, and the SBOM travels as an artefact. That makes a job of its own
  # that runs no project code possible, and this is it.
  #
  # The digest comes straight from `build` as a job output, never re-resolved
  # from the tag: the two jobs cannot disagree about what was pushed.
  #
  # `needs: build` and nothing else: a skipped or failed `build` skips this
  # too, so there is no path on which an image gets attested that was not
  # built, scanned and pushed. It sits beside `preview` and `production`
  # rather than in front of them; a deploy does not wait on it.
  #
  # Attestations on a private repository need GitHub Enterprise Cloud; on
  # the Free plan they work only while the repository is public, which it
  # is since 2026-09-27. In use since then: the image of v2026.9.30
  # (be6f388) carries both attestations, and `gh attestation verify
  # oci://ghcr.io/digigilde/plak@<digest> -R DigiGilde/plak` checks them.
  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/attest reads ~/.docker/config.json for the registry push, so
      # the login below is what makes `push-to-registry` work.
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.sha }}

      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.name }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.name }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true


  # Only a release tag reaches production, never a branch push. The
  # ZAD_PROJECT_ID guard is the same one `preview` carries: without a
  # project there is nothing to deploy to, and the action would fail on an
  # empty api-key instead of standing down.
  #
  # The guards below run from the workflow file of the tagged commit, so
  # they catch a mistaken tag, not someone who edits them on that commit:
  # that takes a tag ruleset and the deployment rules of `productie`.
  production:
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && vars.ZAD_PROJECT_ID != ''
    runs-on: ubuntu-latest
    needs: [ci, build]
    permissions:
      contents: read
    environment:
      name: productie
      url: ${{ steps.rollout.outputs.url }}
    # Two tags pushed close together roll out one after the other, so an
    # older one cannot finish last.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag format
        run: |
          if [[ ! "${TAG}" =~ ${RELEASE_TAG} ]]; then
            echo "::error::${TAG} is not a release tag of the form vYYYY.M.D[.N]"
            exit 1
          fi

      - name: Check that the tagged commit is on beta
        run: |
          git fetch --no-tags origin +refs/heads/beta:refs/remotes/origin/beta
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/beta; then
            echo "::error::${TAG} points at ${GITHUB_SHA}, which is not on beta"
            exit 1
          fi

      # An old tag pushed again would otherwise roll production back.
      - name: Check that the tag is the newest release
        run: |
          git fetch --force --tags origin
          newest=$(git tag -l 'v[0-9]*' | grep -E "${RELEASE_TAG}" | sort -V | tail -1)
          if [ "${newest}" != "${TAG}" ]; then
            echo "::error::${TAG} is not the newest release tag (${newest} is)"
            exit 1
          fi

      - name: Roll out to ZAD
        id: rollout
        uses: RijksICTGilde/zad-actions/deploy@4ac541a57542a22bde95b28f3ace4ee3123acd7a # v4.2.0
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: productie
          component: beheer
          image: ${{ needs.build.outputs.image }}
