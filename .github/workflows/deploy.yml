# Preparatory: the repo has no remote yet, so this workflow has never run.
# It records how Plak will end up on ZAD: build and push the image, then
# deploy with zad-actions.
#
# Needed in advance, outside this file:
#   - repository secret ZAD_API_KEY (to create in the ZAD portal);
#   - repository variable ZAD_PROJECT_ID (ZAD's project key, with the
#     suffix the platform assigns);
#   - a ZAD project following deploy/plak-project.example.yaml, with the
#     deployment `productie` and the component `beheer`.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Deploy

on:
  push:
    branches: [main, beta]
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/ci.yml

  # A dependabot PR does not need a preview environment; the gate above
  # still runs over it.
  #
  # needs: ci, so an image only gets built (and can only reach a preview or
  # production) once the tests pass; without this a pull request can deploy
  # unreviewed, untested code to a preview that inherits production secrets
  # (see the preview job below).
  bouw:
    needs: ci
    if: github.event.action != 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Imagetag bepalen
        id: tag
        run: |
          naam="${REGISTRY}/${IMAGE_NAME}"
          naam="$(echo "${naam}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=${naam}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${naam}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Inloggen bij het register
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needed for the cache step below: the default driver cannot export
      # cache, this action boots one with the docker-container driver.
      - name: Buildx klaarzetten
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build context is the repo root: the image bundles the built admin
      # SPA from frontend/ alongside the backend (see
      # containers/plak/Containerfile).
      - name: Image bouwen en pushen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/plak/Containerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SBOM genereren (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: cyclonedx
          output: sbom.cdx.json
          version: v0.74.0

      - name: SBOM bewaren
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Everything in the log first, only then the gate. The difference
      # between "not found" and "seen, deliberately not blocked" is
      # exactly what an auditor asks first.
      - name: Image scannen, volledig rapport (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "0"
          version: v0.74.0

      # A red scan fails `bouw` and thereby also `preview` and `productie`;
      # the tag stays in the registry, but nothing deploys with it.
      - name: Image scannen, poort op hoog en kritiek (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    # bouw already needs: ci, so this is transitively gated too; named
    # explicitly to match productie's needs: [ci, bouw] below.
    needs: [ci, bouw]
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: pr${{ github.event.pull_request.number }}
      url: ${{ steps.uitrol.outputs.url }}
    env:
      # The same base URL the deploy action defaults to, named once so the
      # step below and the action cannot drift apart. The action gets it
      # explicitly for that reason.
      ZAD_API_BASE_URL: https://operations-manager.rig.prd1.gn2.quattro.rijksapps.nl/api
    steps:
      # A preview inherits the component-wide user-env-vars, and those are
      # productie's PLAK_SESSION_SECRET, PLAK_AUDIT_PEPPER and
      # PLAK_AUDIT_IP_KEY. So the deployment is created here first with
      # rollout=false, which writes it to the project file and puts nothing
      # on the cluster, and then gets its own three secrets at the
      # deployment-component layer, which wins over the component-wide
      # value. Only the step after this one rolls out, so a preview pod
      # never runs with productie's secrets, not even briefly.
      #
      # The order is forced: the values endpoint answers 404 until the
      # component is attached to the deployment, so the deployment has to
      # exist in the project file before the secrets can be written to it.
      #
      # Verified against the Operations Manager OpenAPI (vendored in
      # RijksICTGilde/zad-cli as api/upstream-openapi.json) and the handlers
      # in RijksICTGilde/RIG-Cluster: upsert_deployment and
      # configure_service_values both honour rollout=false, both take the
      # project API key in X-API-Key, and both are asynchronous, hence the
      # polling.
      #
      # The secrets are generated once per preview and never rotated on a
      # later push: a rewrite would be a change saved with rollout=false
      # that the rollout below has no reason to pick up.
      - name: Preview voorzien van eigen geheimen
        env:
          ZAD_API_KEY: ${{ secrets.ZAD_API_KEY }}
          PROJECT_ID: ${{ vars.ZAD_PROJECT_ID }}
          DEPLOYMENT: pr${{ github.event.pull_request.number }}
          COMPONENT: beheer
          IMAGE: ${{ needs.bouw.outputs.image }}
        run: |
          set -euo pipefail

          values="${ZAD_API_BASE_URL}/v2/projects/${PROJECT_ID}/services/user-env-vars/values/deployment/${DEPLOYMENT}/component/${COMPONENT}"

          # Sets CALL_CODE and CALL_BODY. A body is piped in, never passed as
          # an argument, so no secret ends up in the process list.
          call() {
            local method="$1" url="$2" body="${3-}" out
            if [ -n "$body" ]; then
              out=$(printf '%s' "$body" | curl -sS -w '\n%{http_code}' --max-time 60 \
                -X "$method" -H "X-API-Key: ${ZAD_API_KEY}" \
                -H 'Content-Type: application/json' --data-binary @- "$url")
            else
              out=$(curl -sS -w '\n%{http_code}' --max-time 60 \
                -X "$method" -H "X-API-Key: ${ZAD_API_KEY}" "$url")
            fi
            CALL_CODE=$(printf '%s' "$out" | tail -n1)
            CALL_BODY=$(printf '%s' "$out" | sed '$d')
          }

          eis_geslaagd() {
            case "${CALL_CODE}" in
              2*) return 0 ;;
            esac
            echo "::error::$1 gaf HTTP ${CALL_CODE}"
            echo "${CALL_BODY}"
            return 1
          }

          # Both writes are asynchronous: the task has to finish before the
          # next step may assume its result.
          wacht_op_taak() {
            local id status
            id=$(printf '%s' "${CALL_BODY}" | jq -r '.task_id // empty')
            if [ -z "${id}" ]; then
              echo "::error::$1 leverde geen task_id op"
              return 1
            fi
            for _ in $(seq 1 120); do
              call GET "${ZAD_API_BASE_URL}/tasks/${id}"
              eis_geslaagd "Opvragen van taak ${id}"
              status=$(printf '%s' "${CALL_BODY}" | jq -r '.status // empty')
              case "${status}" in
                completed) return 0 ;;
                failed|cancelled)
                  echo "::error::$1 is ${status}"
                  printf '%s' "${CALL_BODY}" | jq -r '.error_message // empty'
                  return 1 ;;
              esac
              sleep 5
            done
            echo "::error::$1 was na tien minuten nog niet klaar"
            return 1
          }

          echo "Deployment ${DEPLOYMENT} aanmaken zonder uitrol"
          aanmaak=$(jq -n --arg d "${DEPLOYMENT}" --arg c "${COMPONENT}" --arg i "${IMAGE}" \
            '{deploymentName: $d, cloneFrom: "productie", components: [{reference: $c, image: $i}]}')
          call POST "${ZAD_API_BASE_URL}/v2/projects/${PROJECT_ID}/:upsert-deployment?rollout=false" "${aanmaak}"
          eis_geslaagd "Aanmaken van de deployment"
          wacht_op_taak "Aanmaken van de deployment"

          call GET "${values}"
          eis_geslaagd "Uitlezen van de previewgeheimen"
          compleet=true
          for naam in PLAK_SESSION_SECRET PLAK_AUDIT_PEPPER PLAK_AUDIT_IP_KEY; do
            printf '%s' "${CALL_BODY}" | jq -e --arg n "${naam}" '.values | has($n)' >/dev/null || compleet=false
          done
          if [ "${compleet}" = true ]; then
            echo "Deze preview heeft al eigen geheimen; ongewijzigd gelaten"
            exit 0
          fi

          echo "Eigen geheimen aanmaken voor ${DEPLOYMENT}"
          # base64 of 32 random bytes each: long enough for the two 32-byte
          # minimums, and the exact shape PLAK_AUDIT_IP_KEY wants. The
          # alphabet carries no whitespace or quotes, so the value reads back
          # byte for byte, which the API requires.
          SESSION_SECRET=$(openssl rand -base64 32 | tr -d '\n')
          AUDIT_PEPPER=$(openssl rand -base64 32 | tr -d '\n')
          AUDIT_IP_KEY=$(openssl rand -base64 32 | tr -d '\n')
          echo "::add-mask::${SESSION_SECRET}"
          echo "::add-mask::${AUDIT_PEPPER}"
          echo "::add-mask::${AUDIT_IP_KEY}"
          export SESSION_SECRET AUDIT_PEPPER AUDIT_IP_KEY

          # A partly filled layer is cleared first: POST refuses a name that
          # is already there, and this layer belongs to this preview alone.
          call DELETE "${values}?rollout=false"
          eis_geslaagd "Leegmaken van de previewgeheimen"
          wacht_op_taak "Leegmaken van de previewgeheimen"

          geheimen=$(jq -n '{values: {
            PLAK_SESSION_SECRET: env.SESSION_SECRET,
            PLAK_AUDIT_PEPPER: env.AUDIT_PEPPER,
            PLAK_AUDIT_IP_KEY: env.AUDIT_IP_KEY
          }}')
          call POST "${values}?rollout=false" "${geheimen}"
          eis_geslaagd "Zetten van de previewgeheimen"
          wacht_op_taak "Zetten van de previewgeheimen"

      # clone-from copies the `productie` deployment, but DROPS THE WEB
      # ADDRESS: a preview lands on the cluster address with a single host,
      # not on beheer.plak.<domain> plus plak.<domain>. `components` is
      # also on the clone's exclusion list, so production's env vars do
      # not come along: a preview needs its own
      # PLAK_BASE_URL/PLAK_CONTENT_BASE_URL. This action (v2) cannot set
      # that; see docs/deploying-on-zad.md, "Wat nog openstaat".
      #
      # The step above already created the deployment (rollout=false), so
      # this call updates it and is the one that rolls out. It processes
      # only this deployment, never productie.
      - name: Uitrollen naar ZAD
        id: uitrol
        uses: RijksICTGilde/zad-actions/deploy@5ad04045d781ed153ad75625305bf14d57496128 # v2
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          api-base-url: ${{ env.ZAD_API_BASE_URL }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: pr${{ github.event.pull_request.number }}
          component: beheer
          image: ${{ needs.bouw.outputs.image }}
          clone-from: productie
          comment-on-pr: true

  opruimen:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
      pull-requests: write
    steps:
      - name: Preview opruimen
        uses: RijksICTGilde/zad-actions/cleanup@5ad04045d781ed153ad75625305bf14d57496128 # v2
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: pr${{ github.event.pull_request.number }}
          delete-github-deployments: true
          delete-container: true
          container-org: ${{ github.repository_owner }}
          container-name: ${{ github.event.repository.name }}
          container-tag: pr-${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The automatic GITHUB_TOKEN may not delete an environment; that
          # needs a PAT with repo admin rights as github-admin-token. Turn
          # on both lines once that exists.
          delete-github-env: false

  productie:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ci, bouw]
    permissions:
      contents: read
    environment:
      name: productie
      url: ${{ steps.uitrol.outputs.url }}
    steps:
      - name: Uitrollen naar ZAD
        id: uitrol
        uses: RijksICTGilde/zad-actions/deploy@5ad04045d781ed153ad75625305bf14d57496128 # v2
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ vars.ZAD_PROJECT_ID }}
          deployment-name: productie
          component: beheer
          image: ${{ needs.bouw.outputs.image }}
