# Opens the release pull request (docs/releasing.md): the button under
# Actions. `just release` does the same from a developer's machine.
#
# `prepare` runs release.py prepare on beta: the fragments in changelog.d/
# become the next CHANGELOG section and What's new notes, the component
# versions and the API schema move to the release, and the fragments go.
# It hands that on as a patch. `open` applies the patch to a clean
# checkout, checks that it is the release and nothing else, and only then
# gets a token of the digigilde-plak-release App. It commits
# `Release vX`, pushes it as the branch release/vX and opens the pull
# request "Release vX" into beta. Merging that pull request is the
# release (release.yml). A pull request opened with GITHUB_TOKEN would
# start no checks; one opened by the App does.
#
# The split is the point: `prepare` runs uv sync and the backend, so
# anything a dependency does happens on a runner that never holds the
# token, and whatever it slips into the patch is refused by `open`.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    # The button offers every branch; a release is made from beta alone.
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The tags decide the next one: a second release that day gets .1.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # As in api.yml: the image pinned in .github/oasdiff/Containerfile.
      - name: Install oasdiff
        run: |
          set -euo pipefail
          image="$(grep -oE '^FROM docker\.io/tufin/oasdiff:[^@ ]+@sha256:[0-9a-f]{64}$' \
            .github/oasdiff/Containerfile | cut -d' ' -f2 || true)"
          if [ -z "$image" ]; then
            echo "No oasdiff image pinned by digest in .github/oasdiff/Containerfile" >&2
            exit 1
          fi
          docker create --name oasdiff "$image" > /dev/null
          docker cp oasdiff:/usr/bin/oasdiff "$RUNNER_TEMP/oasdiff"
          docker rm oasdiff > /dev/null
          "$RUNNER_TEMP/oasdiff" --version

      - name: Print the API schema
        working-directory: backend
        run: uv run python -m plak.api.openapi_file > "$RUNNER_TEMP/openapi.json"

      - name: Write the release
        id: prepare
        run: |
          python3 .github/scripts/release.py prepare \
            --spec "$RUNNER_TEMP/openapi.json" --oasdiff "$RUNNER_TEMP/oasdiff"

      - name: Hand the release on as a patch
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/release/release.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/release.patch
          retention-days: 1
          if-no-files-found: error

  open:
    needs: prepare
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's key lives in this environment, which only beta may use.
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # verify-staged holds the tag against the ones that exist.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      # The tag comes from the job that ran the dependencies, like the patch.
      - name: Check the tag
        run: python3 .github/scripts/release.py validate-tag "$TAG"

      # Into the index only: the working tree, and the release.py the next
      # step runs from it, stay as the commit has them, whatever the patch
      # holds.
      - name: Apply the release
        run: git apply --cached --binary "$RUNNER_TEMP/release/release.patch"

      # The patch has to be exactly what prepare writes for this tag, or it
      # goes nowhere.
      - name: Check that it is the release and nothing else
        run: python3 .github/scripts/release.py verify-staged --tag "$TAG"

      - name: Get a token of the release App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # No --force: the branch of an earlier press for this tag refuses the
      # push, so one tag never gets a second pull request. A branch left by
      # a run that pushed and then failed to open the pull request is named
      # before the push, so the person knows what to delete.
      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}"
          if git -c "$header" ls-remote --exit-code origin "refs/heads/release/${TAG}" > /dev/null; then
            echo "::error::The branch release/${TAG} exists already. Delete it and run the workflow again." >&2
            exit 1
          fi
          bot="${APP_SLUG}[bot]"
          id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git commit -q -m "Release ${TAG}"
          git -c "$header" push origin "HEAD:refs/heads/release/${TAG}"
          body="Merging this pull request releases ${TAG}: on beta, release.yml tags the commit that adds its CHANGELOG section, and production follows the tag."
          body+=$'\n\n'"The CHANGELOG section and the What's new notes may be edited in this pull request before it merges. If an API change or another changelog fragment reaches beta first, close this one, delete its branch and prepare the release again (docs/releasing.md)."
          gh pr create --repo "$GITHUB_REPOSITORY" --base beta --head "release/${TAG}" \
            --title "Release ${TAG}" --body "$body"
