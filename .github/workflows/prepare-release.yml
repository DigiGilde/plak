# Opens the release pull request (docs/releasing.md) and keeps it current.
# The button under Actions opens it; `just release` does the same from a
# developer's machine. Every push to beta then refreshes the open one.
#
# `prepare` runs release.py prepare on beta: the fragments in changelog.d/
# become the next CHANGELOG section and What's new notes, the component
# versions and the API schema move to the release, and the fragments go.
# It hands that on as a patch. `open` applies the patch to a clean
# checkout, checks that it is the release and nothing else, and only then
# gets a token of the digigilde-plak-release App. It commits
# `Release vX`, pushes it as the branch release/vX and opens the pull
# request "Release vX" into beta. Merging that pull request is the
# release (release.yml). A pull request opened with GITHUB_TOKEN would
# start no checks; one opened by the App does.
#
# On a push to beta the same two jobs refresh the open release pull
# request, if there is one, so it always releases what beta has: the
# branch is force-pushed (with a lease on the commit that was read, so a
# push in between refuses), which overwrites hand edits in that pull
# request. The tag stays while verify-staged would still take it; a stale
# one gets a new branch and pull request, and the old one is closed. A
# push never opens a first release pull request, and never refreshes one
# while beta's newest section still waits for its tag.
#
# The split is the point: `prepare` runs uv sync and the backend, so
# anything a dependency does happens on a runner that never holds the
# token, and whatever it slips into the patch is refused by `open`. For
# the same reason `open` takes only the tag (validated) and whether
# anything changed from `prepare`: which pull request to touch it looks up
# itself, with the read-only workflow token, before the App token exists.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Prepare release

on:
  workflow_dispatch:
  push:
    branches: [beta]

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    # The button offers every branch; a release is made from beta alone.
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To find the open release pull request on a push.
      pull-requests: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The tags decide the next one: a second release that day gets .1.
          fetch-depth: 0
          persist-credentials: false

      - name: Is a release waiting for its tag
        id: pending
        run: python3 scripts/release.py pending

      # The button opens a pull request. A push refreshes the open one from
      # a release/v* branch of this repository, and does nothing without one
      # or while a merged release still waits for its tag (release.yml).
      - name: Find the open release pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PENDING: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "mode=open" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PENDING" ]; then
            echo "::notice::v${PENDING} is waiting for its tag; the release pull request is left as it is."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found="$(gh pr list --repo "$GITHUB_REPOSITORY" --base beta --state open \
            --json number,headRefName,headRefOid,headRepositoryOwner \
            | python3 scripts/release.py release-pr --repo "$GITHUB_REPOSITORY")"
          number="$(printf '%s\n' "$found" | sed -n 's/^number=//p')"
          if [ -z "$number" ]; then
            echo "No open release pull request to refresh."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Refreshing #${number} from beta."
          echo "mode=refresh" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.find.outputs.mode != 'none'
        uses: ./.github/actions/setup-uv

      - name: Install oasdiff
        id: oasdiff
        if: steps.find.outputs.mode != 'none'
        uses: ./.github/actions/install-oasdiff

      - name: Print the API schema
        if: steps.find.outputs.mode != 'none'
        working-directory: backend
        run: uv run python -m toon.api.openapi_file > "$RUNNER_TEMP/openapi.json"

      # A refresh keeps the pull request's tag while verify-staged would
      # still take it, and moves to the next one otherwise.
      - name: Pick the tag
        id: tag
        if: steps.find.outputs.mode == 'refresh'
        env:
          OLD_TAG: ${{ steps.find.outputs.old_tag }}
        run: python3 scripts/release.py refresh-tag --branch "release/${OLD_TAG}"

      - name: Write the release
        id: prepare
        if: steps.find.outputs.mode != 'none'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          OASDIFF: ${{ steps.oasdiff.outputs.path }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TAG" ]; then
            args+=(--tag "$TAG")
          fi
          python3 scripts/release.py prepare \
            --spec "$RUNNER_TEMP/openapi.json" --oasdiff "$OASDIFF" ${args[@]+"${args[@]}"}

      # A refresh that would push the very same tree is no refresh.
      - name: Compare with the open pull request
        id: compare
        if: steps.find.outputs.mode != 'none'
        env:
          MODE: ${{ steps.find.outputs.mode }}
          OLD_SHA: ${{ steps.find.outputs.old_sha }}
        run: |
          set -euo pipefail
          if [ "$MODE" = refresh ] && [ "$(git write-tree)" = "$(git rev-parse "${OLD_SHA}^{tree}")" ]; then
            echo "The open release pull request already has what beta would release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the release on as a patch
        if: steps.compare.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/release/release.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.compare.outputs.changed == 'true'
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/release.patch
          retention-days: 1
          if-no-files-found: error

  open:
    needs: prepare
    if: github.ref == 'refs/heads/beta' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's key lives in this environment, which only beta may use.
    environment: release
    permissions:
      contents: read
      # To find the open release pull request itself, before the App token.
      pull-requests: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # verify-staged holds the tag against the ones that exist.
          fetch-depth: 0
          persist-credentials: false

      # Which pull request a refresh touches is decided here, with the
      # read-only workflow token, not taken from `prepare`: that job ran the
      # dependencies, and with the App token this one closes and comments.
      - name: Find the open release pull request
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --base beta --state open \
            --json number,headRefName,headRefOid,headRepositoryOwner \
            | python3 scripts/release.py release-pr --repo "$GITHUB_REPOSITORY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      # The tag comes from the job that ran the dependencies, like the patch.
      - name: Check the tag
        run: python3 scripts/release.py validate-tag "$TAG"

      # Into the index only: the working tree, and the release.py the next
      # step runs from it, stay as the commit has them, whatever the patch
      # holds.
      - name: Apply the release
        run: git apply --cached --binary "$RUNNER_TEMP/release/release.patch"

      # The patch has to be exactly what prepare writes for this tag, or it
      # goes nowhere.
      - name: Check that it is the release and nothing else
        run: python3 scripts/release.py verify-staged --tag "$TAG"

      - name: Get a token of the release App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Opening (the button): no --force, so the branch of an earlier press
      # for this tag refuses the push and one tag never gets a second pull
      # request; a branch left by a run that pushed and then failed to open
      # the pull request is named before the push, so the person knows what
      # to delete. A push refreshes the pull request this job found itself,
      # and never opens one. Same tag: a force-push with a lease on the
      # commit found, so a push in between refuses. New tag (verify-staged
      # accepted it): a new branch and pull request, the found pull request
      # closed with the reason and its own branch deleted.
      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ steps.find.outputs.number }}
          OLD_TAG: ${{ steps.find.outputs.old_tag }}
          OLD_SHA: ${{ steps.find.outputs.old_sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}"
          bot="${APP_SLUG}[bot]"
          id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          refreshed="This pull request is refreshed on every push to beta, so it always releases what beta has; edits made here are overwritten then. Reword the fragments in changelog.d/ instead, or edit this pull request right before merging it (docs/releasing.md)."
          if [ "$EVENT" = push ]; then
            if [ -z "$NUMBER" ]; then
              echo "::error::A push refreshes an open release pull request, and there is none; the button opens one." >&2
              exit 1
            fi
            if ! [[ "$NUMBER" =~ ^[0-9]+$ && "$OLD_SHA" =~ ^[0-9a-f]{40}$ && "$OLD_TAG" =~ ^v[0-9.]+$ ]]; then
              echo "::error::The open release pull request was not found properly (#${NUMBER}, ${OLD_TAG}, ${OLD_SHA})." >&2
              exit 1
            fi
            if [ "$TAG" = "$OLD_TAG" ]; then
              git commit -q -m "Release ${TAG}"
              git -c "$header" push --force-with-lease="refs/heads/release/${TAG}:${OLD_SHA}" \
                origin "HEAD:refs/heads/release/${TAG}"
              gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Refreshed from beta ${GITHUB_SHA}: the release now holds everything merged so far. ${refreshed}"
              exit 0
            fi
          fi
          if git -c "$header" ls-remote --exit-code origin "refs/heads/release/${TAG}" > /dev/null; then
            echo "::error::The branch release/${TAG} exists already. Delete it and run the workflow again." >&2
            exit 1
          fi
          git commit -q -m "Release ${TAG}"
          git -c "$header" push origin "HEAD:refs/heads/release/${TAG}"
          body="Merging this pull request releases ${TAG}: on beta, release.yml tags the commit that adds its CHANGELOG section, and production follows the tag."
          body+=$'\n\n'"${refreshed}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base beta --head "release/${TAG}" \
            --title "Release ${TAG}" --body "$body"
          if [ "$EVENT" = push ]; then
            gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Replaced by the release pull request for ${TAG}: the tag ${OLD_TAG} is no longer dated today or yesterday, or no longer the newest."
          fi
