# Releases from CHANGELOG.md (docs/releasing.md), on every push to beta.
#
# A release is the pull request "Release vX" that prepare-release.yml or
# `just release` opens: it turns the fragments in changelog.d/ into the
# newest CHANGELOG section. Merging it is the release. `decide` sees that
# the newest section has no tag yet, finds the commit that added it and
# checks that this commit carries the version everywhere and leaves no
# fragment behind. `tag` then gets a token of the digigilde-toon-release
# App, the only actor the ruleset lets create a release tag, and pushes
# the annotated tag vX on that commit: a push that, unlike one with
# GITHUB_TOKEN, starts deploy.yml for the tag. Production and the GitHub
# Release follow from that tag.
#
# Nothing here writes to beta, and the App could not: it has no bypass on
# the beta ruleset, so its token only adds the tag. Every other push, and
# a rerun once the tag is up, finds the newest section tagged and stops
# at `decide`.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Release

on:
  push:
    branches: [beta]

permissions:
  contents: read

# One release at a time, in push order: a later push waits rather than
# cancelling one that is tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.decide.outputs.route }}
      tag: ${{ steps.decide.outputs.tag }}
      commit: ${{ steps.decide.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags say whether the newest section is released; the history
          # says which commit added it.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this push releases
        id: decide
        run: python3 scripts/release.py decide

  tag:
    needs: decide
    if: needs.decide.outputs.route == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's key lives in this environment, which only beta may use.
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.decide.outputs.tag }}
      COMMIT: ${{ needs.decide.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit to tag can be older than the one that was pushed.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: python3 scripts/release.py validate-tag "$TAG"

      - name: Get a token of the release App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Only the tag goes up: a ref that exists already is refused, so a
      # tag is never moved.
      - name: Tag and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "Plak ${TAG}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "refs/tags/${TAG}"
