# Releases from CHANGELOG.md (docs/releasing.md), on every push to beta.
#
# `decide` reads [Unreleased]: entries without the hold marker make the
# push a release. `prepare` writes it with release.py promote (the
# changelog section, the component versions, the API schema) and hands it
# on as a patch. `publish` applies that patch to a clean checkout, checks
# that it is the release and nothing else, and only then gets a token of
# the digigilde-plak-release App: the actor the ruleset on beta lets push,
# and a push that, unlike one with GITHUB_TOKEN, starts deploy.yml for the
# tag. It commits `Release vX`, tags it `vX` and pushes both atomically.
# Production and the GitHub Release follow from that tag.
#
# The split is the point: `prepare` runs uv sync and the backend, so
# anything a dependency does happens on a runner that never holds the
# token, and whatever it slips into the patch is refused by `publish`.
#
# The release commit is a push to beta too; its [Unreleased] is empty, so
# it releases nothing. A push that loses the race with another one to beta
# is rejected as a whole; the next run releases what collected.
#
# All third-party actions are pinned to a commit SHA; the tag after it is
# the readable label, not the reference.

name: Release

on:
  push:
    branches: [beta]

permissions:
  contents: read

# One release at a time, in push order: a later push waits rather than
# cancelling one that is tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.decide.outputs.route }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags decide the next one: a second release that day gets .1.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this push releases
        id: decide
        run: python3 .github/scripts/release.py decide

  prepare:
    needs: decide
    if: needs.decide.outputs.route == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: python3 .github/scripts/release.py validate-tag "$TAG"

      - name: Install uv
        uses: ./.github/actions/setup-uv

      # As in api.yml: the image pinned in .github/oasdiff/Containerfile.
      - name: Install oasdiff
        id: oasdiff
        uses: ./.github/actions/install-oasdiff

      - name: Print the API schema
        working-directory: backend
        run: uv run python -m plak.api.openapi_file > "$RUNNER_TEMP/openapi.json"

      - name: Write the release
        env:
          OASDIFF: ${{ steps.oasdiff.outputs.path }}
        run: |
          python3 .github/scripts/release.py promote --tag "$TAG" \
            --spec "$RUNNER_TEMP/openapi.json" --oasdiff "$OASDIFF"

      - name: Hand the release on as a patch
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/release/release.patch"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release/release.patch
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [decide, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The App's key lives in this environment, which only beta may use.
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      # Into the index only: the working tree, and the release.py the next
      # step runs from it, stay as the commit has them, whatever the patch
      # holds.
      - name: Apply the release
        run: git apply --cached --binary "$RUNNER_TEMP/release/release.patch"

      # The patch comes from a job that ran the dependencies: it has to be
      # exactly what promote writes for this tag, or it goes nowhere.
      - name: Check that it is the release and nothing else
        run: python3 .github/scripts/release.py verify-staged --tag "$TAG"

      - name: Get a token of the release App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The commit and the tag go up together or not at all.
      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          id="$(gh api "/users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git commit -q -m "Release ${TAG}"
          git tag -a "$TAG" -m "Plak ${TAG}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --atomic origin "HEAD:refs/heads/beta" "refs/tags/${TAG}"
