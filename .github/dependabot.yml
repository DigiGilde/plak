# Dependabot rather than Renovate: Renovate needs an app installation or a
# token of its own, and with the default GITHUB_TOKEN its pull requests do
# not run CI.
#
# Three things keep the number of pull requests manageable.
#
# The application dependencies (backend, cli, frontend with e2e) get a group
# for minor and patch plus a second group over the same patterns for major.
# A dependency lands in the first group it matches; a major does not match
# the minor-and-patch group, so without that second group it would come in a
# pull request of its own per package. That broke the pair vitest and
# @vitest/coverage-v8, which pin each other exactly: two separate pull
# requests, neither of which can go green alone. Security updates get a
# group of their own per ecosystem as well.
#
# What only feeds CI and the containers (GitHub Actions, pre-commit hooks,
# base images) shares one pull request across the three ecosystems: the
# multi-ecosystem group `tooling`. The schedule lives on the group, and
# `commit-message` may only be set there; on an entry it is a config error.
#
# And a cooldown: a new version only counts once it is a week old, majors
# only after a month. Broken upstream then surfaces somewhere else first,
# and successive patches land in the same pull request. Security updates
# have no cooldown, so a hole waits for nothing.
#
# The schedules are spread over the week, because they all arrived on
# Monday at 06:00 and pull requests that touch the same lockfile force each
# other to rebase.
#
# Every change to this file starts an update run straight away, outside the
# schedule.
version: 2

multi-ecosystem-groups:
  tooling:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: "ci"

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/publish
    multi-ecosystem-group: tooling
    patterns:
      - "*"
    open-pull-requests-limit: 5
    # github-actions only knows default-days, no semver variants.
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      backend-major:
        patterns:
          - "*"
        update-types:
          - major
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /cli
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      cli:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      cli-major:
        patterns:
          - "*"
        update-types:
          - major
      cli-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      frontend-major:
        patterns:
          - "*"
        update-types:
          - major
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # 30.1.0 and 30.1.1 make the axe tests about five times slower, past
      # the 5s test timeout in CI. A later release comes through again.
      - dependency-name: jsdom
        versions: ["30.1.0", "30.1.1"]
      # 7 ships no JS compiler API (typescript/lib/tsc), which vue-tsc needs.
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: pre-commit
    directory: /
    multi-ecosystem-group: tooling
    patterns:
      - "*"
    open-pull-requests-limit: 5
    # pre-commit only knows default-days, no semver variants.
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories:
      - /containers/plak
      - /containers/nginx-dev
      - /.github/oasdiff
    multi-ecosystem-group: tooling
    patterns:
      - "*"
    open-pull-requests-limit: 5
    # docker only knows default-days, no semver variants.
    cooldown:
      default-days: 7
