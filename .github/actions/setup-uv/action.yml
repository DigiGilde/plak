# setup-uv with the pin in one place. Without a glob the action keeps its
# own default cache key; with one, the cache follows those lockfiles.
name: Set up uv
description: Install uv, optionally caching on the given lockfiles.

inputs:
  cache-dependency-glob:
    description: Lockfile glob that keys the uv cache; empty keeps the action's default.
    default: ""
  python-version:
    description: Python version for uv to use; empty keeps the project's own.
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      if: ${{ inputs.cache-dependency-glob == '' }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv with a cache
      if: ${{ inputs.cache-dependency-glob != '' }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
