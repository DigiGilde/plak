# The CI tooling: release.py with its package plak_release, rulesets.py and
# vulnerabilities.py. The scripts run on the standard library (plus pyyaml
# for vulnerabilities.py, which its PEP 723 header names); this project
# exists for their tests, which need pytest and friends.
[project]
name = "plak-scripts"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "packaging>=24,<27",
    "pytest>=9,<10",
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

# The backend's rules; ruff resolves its config per file, so without this
# the scripts would fall back to the defaults.
[tool.ruff]
extend = "../backend/pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
