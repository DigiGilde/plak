# The redirect on the old Plak hosts, as an attachment on the component `wacht`
# (docs/deploying-on-zad.md §12). It replaces the haproxy.cfg of the
# haproxy-redirect image, which has one target per pod and logs the whole URL.
global
    log stdout format raw local0
    maxconn 256
    nbthread 1

defaults
    log     global
    mode    http
    option  dontlognull
    # The default of `option httplog`, with the query taken out: the key of a
    # secret link sits there. %HPO is the path without host or query.
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %tsc %HM %HPO"
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

frontend in
    bind *:8080

    acl is_health path /healthz /readyz
    http-request set-log-level silent if is_health
    http-request return status 200 content-type "text/plain" string "ok" if is_health

    # A client that writes gets no redirect: curl counts one as success, and the
    # CLI could only say `HTTP 302`.
    acl writes method POST PUT PATCH DELETE
    http-request return status 410 content-type "application/problem+json" string '{"title":"Moved","status":410,"detail":"Plak is now called Toon. Nothing was published. Point this client at https://beheer.toon.rijks.app."}' if writes

    acl from_admin hdr(host),field(1,:) -i beheer.plak.rijks.app
    http-request redirect prefix "https://beheer.toon.rijks.app" code 302 if from_admin
    http-request redirect prefix "https://toon.rijks.app" code 302
